plugins {
	id 'org.springframework.boot' version '2.2.2.RELEASE'
	id 'io.spring.dependency-management' version '1.0.9.RELEASE'
	id 'java'
}

group = 'com.csquare.lc.ms.orders'
version = '0.0.1-SNAPSHOT'
targetCompatibility = '11'
sourceCompatibility = '11'

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'commons-net:commons-net:3.6'
	implementation 'com.google.code.gson:gson:2.8.5'

	implementation ('org.springframework.boot:spring-boot-starter-web'){
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-json'
	}
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.kafka:spring-kafka:2.3.4.RELEASE'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.kafka:spring-kafka:2.3.4.RELEASE'
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'com.microsoft.azure:azure-storage:8.6.0'
	implementation 'io.springfox:springfox-swagger2:2.9.2'
	implementation 'io.springfox:springfox-swagger-ui:2.9.2'

	compile group: 'com.google.zxing', name: 'core', version: '3.4.0'
	compile group: 'com.google.zxing', name: 'javase', version: '3.4.0'

	compile group: 'p6spy', name: 'p6spy', version: '3.7.0'

	runtimeOnly 'mysql:mysql-connector-java'
	runtimeOnly 'org.postgresql:postgresql'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation('org.springframework.boot:spring-boot-starter-test') {
		exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
	}
}

// ms-lib dependency
dependencies {
	compile files('../../ms-lib/build/libs/ms-lib-1.0.0.jar')
}

// ms-orders-lib dependency
dependencies {
	compile files('../ms-orders-lib/build/libs/ms-orders-lib-0.0.1.jar')
}

test {
	useJUnitPlatform()
}

jar {
	enabled = true
}
